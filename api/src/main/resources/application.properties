# Puerto del servidor Spring Boot
server.port=8080

# Nombre de la aplicación (puedes cambiarlo si tu equipo decide un nombre final)
spring.application.name=api-nutrifit

# Configuración de conexión a PostgreSQL (usa variables de entorno o valores por defecto)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nutrifit_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# URL de la API externa de alimentos (Open Food Facts)
app.api.openfoodfacts.url=https://world.openfoodfacts.org/cgi/search.pl
