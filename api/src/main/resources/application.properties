# API REST de Solea (Spring Boot)
# No guarda datos: la persistencia (Hibernate + PostgreSQL) está en la app de escritorio.
# Esta API centraliza la lógica nutricional y consulta Open Food Facts en internet.

server.port=${API_PORT:8081}
spring.application.name=api-solea

# Las respuestas de error incluyen el mensaje (los manejamos en ManejadorErrores)
server.error.include-message=always

# ---------------- Open Food Facts (API externa) ----------------
# Buscador oficial de Open Food Facts (el antiguo /cgi/search.pl responde 503)
app.openfoodfacts.url=https://search.openfoodfacts.org/search
# Open Food Facts pide identificar la aplicación con un User-Agent
app.openfoodfacts.user-agent=Solea/1.0 (proyecto universitario JavaFX)
app.openfoodfacts.timeout-conexion-ms=3000
app.openfoodfacts.timeout-lectura-ms=8000
# Cuántos minutos se guardan en memoria los resultados de una búsqueda
app.openfoodfacts.cache-minutos=30
